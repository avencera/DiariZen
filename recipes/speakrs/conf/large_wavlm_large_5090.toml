# Probe candidate for an RTX 5090. Batch sizes are not memory claims.

[meta]
save_dir = "../speakrs/exp_large_5090"
seed = 3407

[finetune]
finetune = false

[trainer]
path = "trainer_dual_opt.Trainer"

[trainer.args]
max_epochs = 100
gradient_percentile = 90
gradient_history_size = 1000
save_max_score = false
save_ckpt_interval = 1
max_patience = 10
max_num_checkpoints = 3
ranked_checkpoint_count = 5
gradient_accumulation_steps = 16
validation_interval = 1
validation_before_training = true
freeze_wavlm = false
lr_decay = false
use_one_cycle_lr = false
warmup_steps = 0

[optimizer_small]
path = "torch.optim.AdamW"

[optimizer_small.args]
lr = 1e-5
betas = [0.9, 0.999]
eps = 1.0e-8
weight_decay = 0.01

[optimizer_big]
path = "torch.optim.AdamW"

[optimizer_big.args]
lr = 1e-3
betas = [0.9, 0.999]
eps = 1.0e-8
weight_decay = 0.01

[model]
path = "diarizen.models.eend.model_wavlm_conformer.Model"

[model.args]
wavlm_src = "../speakrs/artifacts/wavlm-large-torchaudio.pt"
strict_wavlm_load = true
wavlm_layer_num = 25
wavlm_feat_dim = 1024
attention_in = 256
ffn_hidden = 1024
num_head = 4
num_layer = 4
kernel_size = 31
dropout = 0.1
chunk_size = 8
use_posi = false
output_activate_function = false
selected_channel = 0
max_speakers_per_chunk = 4
max_speakers_per_frame = 2

[train_dataset]
path = "dataset.DiarizationDataset"

[train_dataset.args]
scp_file = "../speakrs/data/large_cc_v1/train/wav.scp"
rttm_file = "../speakrs/data/large_cc_v1/train/rttm"
uem_file = "../speakrs/data/large_cc_v1/train/all.uem"
chunk_size = 8
chunk_shift = 6
sample_rate = 16000

[train_dataset.dataloader]
batch_size = 4
num_workers = 4
drop_last = true
pin_memory = true

[validate_dataset]
path = "dataset.DiarizationDataset"

[validate_dataset.args]
scp_file = "../speakrs/data/large_cc_v1/dev/AMI/wav.scp"
rttm_file = "../speakrs/data/large_cc_v1/dev/AMI/rttm"
uem_file = "../speakrs/data/large_cc_v1/dev/AMI/all.uem"
chunk_size = 8
chunk_shift = 8
sample_rate = 16000

[validate_dataset.dataloader]
batch_size = 4
num_workers = 4
drop_last = false
pin_memory = true
